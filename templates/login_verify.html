{% extends "base.html" %}
{% block title %}Enter your code{% endblock %}
{% block topbar_title %}Two-step sign-in{% endblock %}

{% block content %}
<div style="max-width:360px;margin:60px auto">
  <div class="box">
    <div class="box-head">Enter your code</div>
    <div class="box-body pad">
      <p style="font-size:12.5px;color:#5f6368;line-height:1.6;margin-bottom:12px">
        Open your authenticator app and type the six-digit code for Cowan &amp; Rutter.
      </p>
      <form method="post">
        <div class="form-group">
          <label for="code">Code</label>
          <input type="text" id="code" name="code" class="fin" inputmode="numeric"
                 autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"
                 autofocus required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Continue</button>
          <a href="{{ url_for('logout') }}" class="btn btn-secondary btn-sm">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
